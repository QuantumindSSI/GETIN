# Yield farming strategies for GETIN
# Amounts are percentages of available capital.

strategies:
  conservative:
    description: "Low risk, diversified across liquid staking and lending."
    chains:
      ethereum:
        allocations:
          lido_steth: 30
          aave_v3_weth: 20
        min_deposit_eth: 0.01
      solana:
        allocations:
          jito_sol: 50
        min_deposit_sol: 0.1

  aggressive_solana:
    description: "Maximize yield on Solana with liquid staking."
    chains:
      solana:
        allocations:
          jito_sol: 50
          msol: 30
          kamino_lend_sol: 20
        min_deposit_sol: 0.05

  balanced:
    description: "Equal weight across ETH and SOL ecosystems."
    chains:
      ethereum:
        allocations:
          lido_steth: 25
          aave_v3_usdc: 25
        min_deposit_eth: 0.01
      solana:
        allocations:
          jito_sol: 50
        min_deposit_sol: 0.1

# Protocol config
