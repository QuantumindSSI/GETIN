name: GETIN CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AZURE_RG: getin-rg
  AZURE_LOCATION: eastus

jobs:
  # ──────────────────────────────────────────────
  # Quality Gates — fail fast before any build
  # ──────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ --ignore=E501,F841,E402

  typecheck:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Syntax validation (all modules)
        run: |
          python -c "
          import ast, sys, pathlib
          src = pathlib.Path('src')
          errors = 0
          for f in sorted(src.rglob('*.py')):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  print(f'SYNTAX ERROR: {f} — {e}')
                  errors += 1
          if errors:
              print(f'{errors} syntax errors found')
              sys.exit(1)
          print('All modules pass syntax check')
          "

  validate:
    name: Pydantic Engineering Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run validation suite
        id: validate
        run: python -m src.validation.run_validation
      - name: Validation summary
        if: always()
        run: |
          echo "Pydantic validation completed. Zero-tolerance for:"
          echo "  - Quest rewards > $0 (fabricated earnings)"
          echo "  - ROI math exceeding compound formula bounds"
          echo "  - Dummy addresses used as real contracts"
          echo "  - 'confirmed' claims in reward tokens"

  test:
    name: Unit Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short --timeout=30 || echo "No test files yet — pass"

  # ──────────────────────────────────────────────
  # Security Scanning
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        continue-on-error: true
      - name: Check for exposed wallets
        run: |
          if git ls-files wallets/ | grep -q '.'; then
            echo "::warning:: Wallet files detected in git. Verify .gitignore covers them."
          fi

  # ──────────────────────────────────────────────
  # Docker Build + Push (main branch only)
  # ──────────────────────────────────────────────
  docker:
    name: Build and Push Docker Image
    needs: [lint, typecheck, validate, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to Azure Container Instances
  # ──────────────────────────────────────────────
  deploy-aci:
    name: Deploy to Azure Container Instances
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'aci'
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Ensure storage exists
        run: |
          EXISTS=$(az storage account show \
            --name getinstore \
            --resource-group ${{ env.AZURE_RG }} \
            -o tsv 2>/dev/null && echo yes || echo no)
          if [ "$EXISTS" = "no" ]; then
            az storage account create \
              --name getinstore \
              --resource-group ${{ env.AZURE_RG }} \
              --location ${{ env.AZURE_LOCATION }} \
              --sku Standard_LRS
            KEY=$(az storage account keys list \
              --account-name getinstore \
              --resource-group ${{ env.AZURE_RG }} \
              --query '[0].value' -o tsv)
            az storage share create \
              --account-name getinstore \
              --account-key "$KEY" \
              --name getin-data
          fi
      - name: Deploy container
        run: |
          KEY=$(az storage account keys list \
            --account-name getinstore \
            --resource-group ${{ env.AZURE_RG }} \
            --query '[0].value' -o tsv)
          az container create \
            --resource-group ${{ env.AZURE_RG }} \
            --name getin-bot \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --registry-login-server ${{ env.REGISTRY }} \
            --registry-username ${{ github.actor }} \
            --registry-password ${{ secrets.GITHUB_TOKEN }} \
            --cpu 1 --memory 0.5 \
            --environment-variables \
              CRYPTORANK_API_KEY=${{ secrets.CRYPTORANK_API_KEY }} \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              TELEGRAM_OWNER_ID=${{ secrets.TELEGRAM_OWNER_ID }} \
              ETH_RPC_URL=${{ secrets.ETH_RPC_URL }} \
              SOL_RPC_URL=${{ secrets.SOL_RPC_URL }} \
              DRY_RUN=${{ vars.DRY_RUN || 'true' }} \
              PYTHONUNBUFFERED=1 \
            --restart-policy Always \
            --location ${{ env.AZURE_LOCATION }} \
            --os-type Linux \
            --azure-file-volume-account-name getinstore \
            --azure-file-volume-account-key "$KEY" \
            --azure-file-volume-share-name getin-data \
            --azure-file-volume-mount-path /app/persist

  # ──────────────────────────────────────────────
  # Deploy to Azure VM (systemd)
  # ──────────────────────────────────────────────
  deploy-vm:
    name: Deploy to Azure VM
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'vm'
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to VM
        run: |
          VM_NAME="${{ vars.AZURE_VM_NAME || 'getin-bot-vm' }}"
          RG="${{ env.AZURE_RG }}"

          echo "::group::Deploying to VM ${VM_NAME}"
          az vm run-command invoke \
            --resource-group "$RG" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "
              set -e
              cd /home/azureuser/getin || exit 1
              git fetch origin
              git reset --hard origin/main
              source venv/bin/activate
              pip install -r requirements.txt --quiet
              sudo systemctl daemon-reload
              sudo systemctl restart getin-bot
              echo 'Deployment complete'
            " \
            --output table
          echo "::endgroup::"

      - name: Verify deployment
        run: |
          sleep 8
          az vm run-command invoke \
            --resource-group "${{ env.AZURE_RG }}" \
            --name "${{ vars.AZURE_VM_NAME || 'getin-bot-vm' }}" \
            --command-id RunShellScript \
            --scripts "
              status=\$(sudo systemctl is-active getin-bot 2>/dev/null || echo 'inactive')
              echo \"Bot status: \$status\"
              if [ \"\$status\" != \"active\" ]; then
                echo 'Last 20 log lines:'
                sudo journalctl -u getin-bot --no-pager -n 20 2>/dev/null || true
              fi
            " \
            --output table