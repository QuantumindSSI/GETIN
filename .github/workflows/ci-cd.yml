name: GETIN CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AZURE_RG: getin-rg
  AZURE_LOCATION: eastus

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ --ignore=E501,F841

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install mypy
      - run: python -c "import ast; [ast.parse(open(f'${{ github.workspace }}/src/{m}').read()) for m in ['main.py', 'telegram_bot.py', 'cryptorank_client.py', 'currency_monitor.py', 'yield_scanner.py', 'wallet_setup.py', 'subscriptions.py', 'reporter.py', 'task_scheduler.py']]"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: |
          python -c "
          from src.cryptorank_client import CryptoRankClient
          from src.currency_monitor import CurrencyMonitor
          from src.yield_scanner import YieldScanner
          from src.subscriptions import get_tier, register_user, get_premium_price
          from src.wallet_setup import generate_wallet, generate_solana_wallet
          from src.config_manager import load_yaml
          from src.logger import ActivityLogger

          print('--- Module imports OK ---')

          data = load_yaml('watchlist.yaml')
          assert len(data) == 3, f'Expected 3 projects, got {len(data)}'

          register_user(12345, 'testuser')
          assert get_tier(12345) == 'free'
          assert get_premium_price() == 9.99
          print('--- Subscriptions OK ---')

          logger = ActivityLogger('/tmp/test_activity.jsonl')
          logger.log('Monad', 'swap', '0xabc', {})
          print('--- Logger OK ---')

          print('--- All unit tests passed ---')
          "

  docker:
    name: Build and Push Docker
    needs: [lint, test, typecheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aci:
    name: Deploy to Azure Container Instances
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'aci'
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Ensure storage for persistence
        run: |
          SA_EXISTS=$(az storage account show \
            --name getinstore \
            --resource-group ${{ env.AZURE_RG }} \
            2>/dev/null && echo yes || echo no)
          if [ "$SA_EXISTS" = "no" ]; then
            az storage account create \
              --name getinstore \
              --resource-group ${{ env.AZURE_RG }} \
              --location ${{ env.AZURE_LOCATION }} \
              --sku Standard_LRS
            KEY=$(az storage account keys list \
              --account-name getinstore \
              --resource-group ${{ env.AZURE_RG }} \
              --query '[0].value' -o tsv)
            az storage share create \
              --account-name getinstore \
              --account-key "$KEY" \
              --name getin-data
          fi
      - name: Deploy to Container Instances
        run: |
          KEY=$(az storage account keys list \
            --account-name getinstore \
            --resource-group ${{ env.AZURE_RG }} \
            --query '[0].value' -o tsv)
          az container create \
            --resource-group ${{ env.AZURE_RG }} \
            --name getin-bot \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --registry-login-server ${{ env.REGISTRY }} \
            --registry-username ${{ github.actor }} \
            --registry-password ${{ secrets.GITHUB_TOKEN }} \
            --cpu 1 --memory 0.5 \
            --environment-variables \
              CRYPTORANK_API_KEY=${{ secrets.CRYPTORANK_API_KEY }} \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              TELEGRAM_OWNER_ID=${{ secrets.TELEGRAM_OWNER_ID }} \
              PYTHONUNBUFFERED=1 \
            --restart-policy Always \
            --location ${{ env.AZURE_LOCATION }} \
            --os-type Linux \
            --azure-file-volume-account-name getinstore \
            --azure-file-volume-account-key "$KEY" \
            --azure-file-volume-share-name getin-data \
            --azure-file-volume-mount-path /app/persist

  deploy-vm:
    name: Deploy to Azure VM (systemd)
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'vm'
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update VM and restart bot
        run: |
          VM_NAME="${{ vars.AZURE_VM_NAME || 'getin-bot-vm' }}"
          RESOURCE_GROUP="${{ env.AZURE_RG }}"

          echo "Updating code on VM: $VM_NAME"
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "
              set -e
              cd /opt/getin || cd /home/*/getin || exit 1
              git fetch origin
              git reset --hard origin/main
              sudo systemctl daemon-reload
              sudo systemctl restart getin-bot
              echo 'Bot updated and restarted'
            " \
            --output table

          echo "Checking bot status..."
          sleep 5
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "
              sudo systemctl is-active getin-bot && echo 'Bot is ACTIVE' || echo 'Bot is NOT active'
              tail -n 5 /opt/getin/logs/getin-bot.log 2>/dev/null || tail -n 5 /home/*/getin/logs/getin-bot.log 2>/dev/null
            " \
            --output table
